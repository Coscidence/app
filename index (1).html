<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freedom Banker — Скачать приложение</title>
  <meta name="description" content="Скачайте приложение Freedom Banker для iOS и Android">

  <!-- Open Graph -->
  <meta property="og:title" content="Freedom Banker">
  <meta property="og:description" content="Скачайте приложение Freedom Banker">
  <meta property="og:type" content="website">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .container {
      text-align: center;
      padding: 40px 20px;
      max-width: 400px;
    }

    .logo {
      width: 100px;
      height: 100px;
      background: white;
      border-radius: 24px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p {
      font-size: 16px;
      opacity: 0.7;
      margin-bottom: 40px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status {
      font-size: 14px;
      opacity: 0.6;
      margin-bottom: 40px;
    }

    .manual-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 24px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s, opacity 0.15s;
    }

    .btn:active { transform: scale(0.97); opacity: 0.85; }

    .btn-apple {
      background: white;
      color: #000;
    }

    .btn-google {
      background: #4CAF50;
      color: white;
    }

    .btn svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .divider {
      font-size: 12px;
      opacity: 0.4;
      margin: 10px 0;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="logo">🏦</div>
  <h1>Freedom Banker</h1>
  <p>Мобильный банк для вас</p>

  <div class="spinner" id="spinner"></div>
  <div class="status" id="status">Определяем ваше устройство...</div>

  <div class="manual-links" id="links" style="display:none;">
    <a href="https://apps.apple.com/us/app/freedom-banker/id1631895962" class="btn btn-apple">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
      </svg>
      App Store (iOS)
    </a>

    <div class="divider">или</div>

    <a href="https://play.google.com/store/apps/details?id=kz.bankffin.app" class="btn btn-google">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M3.18 23.76c.3.17.64.22.99.14l13.2-7.52-2.83-2.83-11.36 10.21zM.76 1.04C.29 1.52 0 2.28 0 3.28v17.44c0 1 .29 1.76.77 2.24l.12.11 9.76-9.76v-.23L.88.93l-.12.11zM20.54 10.27l-2.75-1.57-3.1 3.1 3.1 3.1 2.77-1.58c.79-.45.79-1.6-.02-2.05zM4.17.24l13.2 7.52-2.83 2.83L3.18.38C3.49.2 3.87.17 4.17.24z"/>
      </svg>
      Google Play (Android)
    </a>
  </div>
</div>

<script>
  const IOS_URL     = "https://apps.apple.com/us/app/freedom-banker/id1631895962";
  const ANDROID_URL = "https://play.google.com/store/apps/details?id=kz.bankffin.app";

  function getDevice() {
    const ua = navigator.userAgent || navigator.vendor || window.opera;
    if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return "ios";
    if (/android/i.test(ua)) return "android";
    return "desktop";
  }

  function redirect() {
    const device = getDevice();
    const statusEl = document.getElementById("status");
    const spinnerEl = document.getElementById("spinner");
    const linksEl = document.getElementById("links");

    if (device === "ios") {
      statusEl.textContent = "Открываем App Store...";
      setTimeout(() => { window.location.href = IOS_URL; }, 800);
    } else if (device === "android") {
      statusEl.textContent = "Открываем Google Play...";
      setTimeout(() => { window.location.href = ANDROID_URL; }, 800);
    } else {
      // Desktop — показываем обе кнопки
      spinnerEl.style.display = "none";
      statusEl.textContent = "Выберите вашу платформу:";
      linksEl.style.display = "flex";
    }
  }

  redirect();
</script>

</body>
</html>
