<script>
  // ---------- Варианты лендинга ----------
  // Обычная ссылка          → Freedom Banker
  // ?v=premium (+ utm и пр.) → Freedom SuperApp через OneLink:
  //   OneLink — универсальная ссылка AppsFlyer: если приложение установлено,
  //   откроется оно, если нет — нужный стор.
  const APPS = {
    default: {
      name:    "Freedom Banker",
      ios:     "https://apps.apple.com/us/app/freedom-banker/id1631895962",
      android: "https://play.google.com/store/apps/details?id=kz.bankffin.app",
      onelink: null,
      pkgAG:   "kz.bankffin.app",
      agWeb:   "https://appgallery.huawei.com/app/C110059661"
    },
    premium: {
      name:    "Freedom SuperApp",
      ios:     "https://apps.apple.com/kz/app/freedom-superapp/id1619733462",
      android: "https://play.google.com/store/apps/details?id=ffinbank.MyFreedom",
      onelink: "https://freedombank.onelink.me/WNLd/footer071124",
      pkgAG:   "ffinbank.MyFreedom",
      agWeb:   "https://appgallery.huawei.com/app/C110168761"
    }
  };

  const VARIANT = new URLSearchParams(location.search).get("v") === "premium" ? "premium" : "default";
  const APP = APPS[VARIANT];

  // ---------- UTM ----------
  function getUTM() {
    const p = new URLSearchParams(location.search);
    const utm = {};
    ["utm_source","utm_medium","utm_campaign","utm_content","utm_term"].forEach(k => {
      if (p.get(k)) utm[k] = p.get(k);
    });
    return utm;
  }

  // Google Play: пробрасываем UTM через referrer (попадёт в Install Referrer / GA приложения)
  function androidStoreUrl() {
    const utm = getUTM();
    const keys = Object.keys(utm);
    if (!keys.length) return APP.android;
    const referrer = keys.map(k => k + "=" + encodeURIComponent(utm[k])).join("&");
    return APP.android + "&referrer=" + encodeURIComponent(referrer);
  }
  // App Store игнорирует UTM-параметры; кампании для iOS настраиваются
  // через Apple Campaign Links (pt=/ct= в App Store Connect).

  // OneLink: дописываем UTM к ссылке (AppsFlyer их сохранит в атрибуции)
  function onelinkUrl() {
    const utm = getUTM();
    const keys = Object.keys(utm);
    if (!keys.length) return APP.onelink;
    return APP.onelink + "?" + keys.map(k => k + "=" + encodeURIComponent(utm[k])).join("&");
  }

  // Целевая ссылка для устройства с учётом варианта
  function targetUrl(device) {
    if (APP.onelink) return onelinkUrl(); // OneLink сам решит: приложение или стор
    return device === "ios" ? APP.ios : androidStoreUrl();
  }

  // ---------- Метрика ----------
  // Отправка цели (безопасно, если счётчик ещё не загрузился)
  function track(goal, cb) {
    const params = Object.assign({ variant: VARIANT, app: APP.name }, getUTM());
    let called = false;
    const done = () => { if (!called) { called = true; if (cb) cb(); } };
    try {
      ym(window.YM_ID, "reachGoal", goal, params, done);
    } catch (e) { done(); return; }
    if (cb) setTimeout(done, 700); // подстраховка, если Метрика не ответила
  }

  function getDevice() {
    const ua = navigator.userAgent || navigator.vendor || window.opera;
    if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return "ios";
    if (/huawei|honor|harmonyos|hmscore/i.test(ua)) return "huawei";
    if (/android/i.test(ua)) return "android";
    return "desktop";
  }

  // Huawei: открываем страницу приложения в AppGallery по имени пакета;
  // если AppGallery не открылся за 1.6 c — обычный Android-путь.
  function openAppGallery(fallbackUrl) {
    let fallback = setTimeout(() => { window.location.href = fallbackUrl; }, 1600);
    document.addEventListener("visibilitychange", () => { if (document.hidden) clearTimeout(fallback); });
    window.addEventListener("pagehide", () => clearTimeout(fallback));
    window.location.href = "appmarket://details?id=" + APP.pkgAG;
  }

  function redirect() {
    const device = getDevice();
    const statusEl = document.getElementById("status");
    const spinnerEl = document.getElementById("spinner");
    const linksEl = document.getElementById("links");

    if (device === "huawei" && APP.pkgAG) {
      statusEl.textContent = "Открываем AppGallery...";
      setTimeout(() => {
        track("redirect_appgallery", () => { openAppGallery(targetUrl("android")); });
      }, 800);
    } else if (device === "ios" || device === "android" || device === "huawei") {
      const mob = device === "huawei" ? "android" : device;
      statusEl.textContent = APP.onelink ? "Открываем приложение..." :
        (mob === "ios" ? "Открываем App Store..." : "Открываем Google Play...");
      setTimeout(() => {
        track(mob === "ios" ? "redirect_ios" : "redirect_android", () => {
          window.location.href = targetUrl(mob);
        });
      }, 800);
    } else {
      // Desktop — показываем обе кнопки
      spinnerEl.style.display = "none";
      statusEl.textContent = "Выберите вашу платформу:";
      linksEl.style.display = "flex";
      // На десктопе кнопки всегда ведут прямо в сторы (OneLink полезен только на мобильных)
      document.getElementById("btn-ios").href = APP.ios;
      document.getElementById("btn-android").href = androidStoreUrl();
      if (APP.agWeb) {
        document.getElementById("btn-ag").href = APP.agWeb;
        document.getElementById("ag-block").style.display = "block";
      }
      track("desktop_view");
    }
  }

  // Название приложения в заголовке
  document.getElementById("app-name").textContent = APP.name;
  document.title = APP.name + " — Скачать приложение";
  if (VARIANT === "premium") {
    document.body.classList.add("premium");
    document.querySelector(".logo").classList.add("premium");
  }

  // Клики по кнопкам на десктопе
  document.getElementById("btn-ios").addEventListener("click", () => track("click_appstore"));
  document.getElementById("btn-android").addEventListener("click", () => track("click_googleplay"));
  document.getElementById("btn-ag").addEventListener("click", () => track("click_appgallery"));

  redirect();
</script>
